<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sổ Tay Tài Xế VinFast</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-99Y8Z9SSCZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-99Y8Z9SSCZ');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Patch window.fetch to be writable if possible
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          value: originalFetch,
          writable: true,
          configurable: true
        });
      } catch (e) {
        console.warn('Could not patch window.fetch:', e);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
